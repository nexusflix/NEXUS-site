<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlix - Painel de Upload V10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #3498db; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab-active { background: #2563eb; color: white; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-2xl border border-gray-700">
        <h1 class="text-3xl font-bold text-center mb-2 text-blue-400">NEXUSFLIX TV</h1>
        <p class="text-gray-400 text-center mb-8 text-sm">Upload Híbrido: Supabase + GitHub CDN (V10)</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">CODE (MAC)</label>
                <input type="text" id="mac" placeholder="Ex: AA:BB:CC:11:22:33" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all uppercase">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">PIN (7 Dígitos)</label>
                <input type="text" id="pin" maxlength="7" placeholder="Ex: 1234567" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all">
            </div>
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Nome da Playlist (Coluna 'user')</label>
            <input type="text" id="playlist_name" placeholder="Ex: Minha Lista VIP" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all">
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Tipo de lista</label>
            <div class="grid grid-cols-2 gap-2 bg-gray-900 p-1 rounded-lg">
                <button type="button" id="tabM3U" onclick="setListType('m3u')" class="tab-active rounded-md py-3 font-semibold transition-all">URL M3U</button>
                <button type="button" id="tabXtream" onclick="setListType('xtream')" class="rounded-md py-3 font-semibold text-gray-400 hover:text-white transition-all">XTREAM</button>
            </div>
        </div>

        <div id="m3uPanel" class="mb-6">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">URL da lista M3U</label>
            <input type="url" id="m3uUrl" placeholder="https://exemplo.com/lista.m3u" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all text-sm">
            <p class="text-xs text-gray-500 mt-2">A URL será baixada. O GitHub receberá o conteúdo da lista, não a URL.</p>
        </div>

        <div id="xtreamPanel" class="hidden mb-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Servidor Xtream</label>
                <input type="url" id="xtreamServer" placeholder="http://servidor:porta" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all text-sm">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Usuário Xtream</label>
                    <input type="text" id="xtreamUser" placeholder="Usuário" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Senha Xtream</label>
                    <input type="password" id="xtreamPass" placeholder="Senha" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all">
                </div>
            </div>
            <p class="text-xs text-gray-500">O app montará a URL M3U Xtream, baixará a lista e salvará o conteúdo no diretório XTREME.</p>
        </div>

        <div class="mb-6">
            <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Selecionar SLOT de Gravação</label>
            <select id="slot" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 focus:outline-none focus:border-blue-500 transition-all cursor-pointer">
                <option value="List0">SLOT 1 (List0)</option>
                <option value="List1">SLOT 2 (List1)</option>
                <option value="List2">SLOT 3 (List2)</option>
                <option value="List3">SLOT 4 (List3)</option>
                <option value="List4">SLOT 5 (List4)</option>
                <option value="List5">SLOT 6 (List5)</option>
            </select>
        </div>

        <button id="btnSave" onclick="processAndSave()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-lg shadow-lg transform active:scale-95 transition-all flex items-center justify-center">
            <span id="btnText">SALVAR NO ROKU</span>
            <div id="btnLoader" class="hidden loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-6 w-6 ml-3"></div>
        </button>

        <div id="progressContainer" class="hidden mt-6">
            <div class="flex justify-between text-xs text-gray-400 mb-1">
                <span id="progressText">Processando...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-2">
                <div id="progressBar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <div id="status" class="mt-6 p-4 rounded-lg text-sm hidden"></div>
        <div class="mt-8 text-center text-xs text-gray-500">
            <p>V10: conteúdo baixado e importado no GitHub por CODE.</p>
        </div>
    </div>

    <script>
        const SB_URL = "https://ugqowiffckcmfhrhgmbs.supabase.co/rest/v1";
        const SB_KEY = "sb_publishable_DkZWo2w0XeZcmtxnqo-oGA_r0ro6aAX";
        const SB_TABLE = "ROKU-TV-CHANNEL";
        const GH_OWNER = "nexusflix";
        const GH_REPO = "NEXUSFLIX-TV-ROKU";
        const GH_BRANCH = "main";
        const GH_BASE_XTREME = "NEXUSFLIX-ROKU/ROKU/TV/API/GAME/TESTE/DESV/NOVO/KNHEUSB/DG/WW/DN/ROMU/DEV/ROKU/Tv/LIVE/API/XTREME";
        const GH_BASE_M3U = "NEXUSFLIX-ROKU/ROKU/TV/API/GAME/TESTE/DESV/NOVO/KNHEUSB/DG/WW/DN/ROMU/DEV/ROKU/Tv/LIVE/API/M3U";
        let currentListType = "m3u";

        function setListType(type) {
            currentListType = type;
            const isXtream = type === "xtream";
            document.getElementById("m3uPanel").classList.toggle("hidden", isXtream);
            document.getElementById("xtreamPanel").classList.toggle("hidden", !isXtream);
            document.getElementById("tabM3U").classList.toggle("tab-active", !isXtream);
            document.getElementById("tabXtream").classList.toggle("tab-active", isXtream);
            document.getElementById("tabM3U").classList.toggle("text-gray-400", isXtream);
            document.getElementById("tabXtream").classList.toggle("text-gray-400", !isXtream);
        }

        function cleanCode(value) {
            return value.replace(/[^a-zA-Z0-9]/g, "");
        }

        function encodeBase64Utf8(value) {
            const bytes = new TextEncoder().encode(value);
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
            let encoded = "";
            let chunk = "";
            const flushSize = 0x6000;

            function appendTriplet(a, b, c) {
                chunk += alphabet[a >> 2];
                chunk += alphabet[((a & 3) << 4) | (b >> 4)];
                chunk += alphabet[((b & 15) << 2) | (c >> 6)];
                chunk += alphabet[c & 63];
                if (chunk.length >= flushSize) {
                    encoded += chunk;
                    chunk = "";
                }
            }

            let i = 0;
            for (; i + 2 < bytes.length; i += 3) {
                appendTriplet(bytes[i], bytes[i + 1], bytes[i + 2]);
            }
            const remaining = bytes.length - i;
            if (remaining === 1) {
                const a = bytes[i];
                chunk += alphabet[a >> 2];
                chunk += alphabet[(a & 3) << 4];
                chunk += "==";
            } else if (remaining === 2) {
                const a = bytes[i];
                const b = bytes[i + 1];
                chunk += alphabet[a >> 2];
                chunk += alphabet[((a & 3) << 4) | (b >> 4)];
                chunk += alphabet[(b & 15) << 2];
                chunk += "=";
            }
            return encoded + chunk;
        }

        function normalizeXtreamServer(server) {
            return server.trim().replace(/\/+$/, "");
        }

        function buildXtreamM3uUrl(server, user, pass) {
            const base = normalizeXtreamServer(server);
            const params = new URLSearchParams({ username: user, password: pass, type: "m3u_plus", output: "ts" });
            return `${base}/get.php?${params.toString()}`;
        }

        async function downloadListContent(sourceUrl) {
            let response;
            try {
                response = await fetch(sourceUrl, { method: "GET", mode: "cors", cache: "no-store" });
            } catch (error) {
                throw new Error("Não foi possível baixar a lista. O servidor pode bloquear CORS.");
            }
            if (!response.ok) throw new Error(`Falha ao baixar a lista: HTTP ${response.status}`);
            const text = await response.text();
            if (!text.trim()) throw new Error("A lista baixada está vazia.");
            return text;
        }

        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function uploadFileToGithub(fullPath, contentEncoded, ghToken, commitMessage) {
            const apiPath = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${fullPath}`;
            const githubHeaders = {
                "Authorization": `token ${ghToken}`,
                "Accept": "application/vnd.github+json"
            };
            let lastError = "";

            for (let attempt = 1; attempt <= 5; attempt++) {
                const checkRes = await fetch(apiPath, { headers: githubHeaders, cache: "no-store" });
                let sha = null;
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    sha = checkData.sha || null;
                } else if (checkRes.status !== 404) {
                    lastError = `Consulta GitHub HTTP ${checkRes.status}`;
                }

                const uploadRes = await fetch(apiPath, {
                    method: "PUT",
                    headers: { ...githubHeaders, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: commitMessage,
                        content: contentEncoded,
                        branch: GH_BRANCH,
                        ...(sha ? { sha } : {})
                    })
                });

                if (uploadRes.ok) return await uploadRes.json();

                const detail = await uploadRes.text();
                lastError = `HTTP ${uploadRes.status}: ${detail}`;

                if (uploadRes.status === 409 && detail.includes("Timed out validating rule")) {
                    updateProgress(65, `GitHub validando regras; tentando novamente (${attempt}/5)...`);
                    await wait(2500 * attempt);
                    continue;
                }

                if (uploadRes.status === 409) {
                    await wait(1500 * attempt);
                    continue;
                }

                throw new Error(`Erro no upload GitHub: ${lastError}`);
            }

            // Depois de um timeout de regra, verifica se o GitHub concluiu o commit apesar do 409.
            const finalCheck = await fetch(apiPath, { headers: githubHeaders, cache: "no-store" });
            if (finalCheck.ok) return await finalCheck.json();
            throw new Error(`Erro no upload GitHub após 5 tentativas: ${lastError}`);
        }

        function parseM3UAttributes(attributeText) {
            const attrs = {};
            const regex = /([A-Za-z0-9_-]+)=(["'])(.*?)\2|([A-Za-z0-9_-]+)=([^\s]+)/g;
            let match;
            while ((match = regex.exec(attributeText)) !== null) {
                const key = match[1] || match[4];
                const value = match[3] !== undefined ? match[3] : match[5];
                attrs[key] = value;
            }
            return attrs;
        }

        function classifyM3UItem(name, groupTitle, attrs) {
            const normalizedGroup = String(groupTitle || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase()
                .trim();
            const normalizedName = String(name || "")
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .toLowerCase();
            const streamType = String(attrs.type || "").toLowerCase();
            const liveGroup = /(^|\b)(tv ao vivo|tv ao-vivo|ao vivo|canais|canais de tv|canais tv|live|lives|channel|channels|news|sport|esporte|radio|radio)(\b|$)/i;
            const seriesGroup = /(^|\b)(series|serie|séries|temporadas|tv shows)(\b|$)/i;
            const movieGroup = /(^|\b)(filmes|filme|movies|movie|cinema)(\b|$)/i;
            const mixedGroup = /filmes?\s+e\s+s[eé]ries?/i;
            const liveName = /(^|\b)(canal|channel|news|sport|esporte|ao vivo|live|radio|radio)(\b|$)/i;
            const liveUrl = /\.(m3u8|ts)(\?|$)|\b(stream|live)\b/i;

            // O grupo explícito prevalece sobre palavras no nome. Isso evita mandar canais para filmes.
            if (liveGroup.test(normalizedGroup)) return "live";
            if (mixedGroup.test(normalizedGroup) && (liveName.test(normalizedName) || liveUrl.test(String(attrs.url || "")))) return "live";
            if (seriesGroup.test(normalizedGroup)) return "series";
            if (movieGroup.test(normalizedGroup)) return "movie";
            if (/^(live|stream|itv|tv)$/i.test(streamType)) return "live";

            const value = `${normalizedName} ${normalizedGroup}`;
            if (/\b(s\s*\d+|s\d+e\d+|temporada|season|epis[oó]dio|episode|s[eé]ries|series)\b/i.test(value)) return "series";
            if (/\b(filme|filmes|movie|movies|cinema|film)\b/i.test(value)) return "movie";
            return "live";
        }

        function parseM3UToCompleteJson(m3uText, sourceUrl, listType) {
            const lines = m3uText.replace(/^\uFEFF/, "").split(/\r?\n/);
            const items = [];
            let pending = null;
            let pendingRawTags = [];

            for (const originalLine of lines) {
                const line = originalLine.trim();
                if (!line) continue;
                if (line.startsWith("#EXTINF")) {
                    const commaIndex = line.indexOf(",");
                    const header = commaIndex >= 0 ? line.slice(0, commaIndex) : line;
                    const displayName = commaIndex >= 0 ? line.slice(commaIndex + 1).trim() : "Sem título";
                    const colonIndex = header.indexOf(":");
                    const duration = colonIndex >= 0 ? header.slice(colonIndex + 1).split(" ")[0] : "-1";
                    const attributeText = colonIndex >= 0 ? header.slice(colonIndex + 1) : "";
                    const attrs = parseM3UAttributes(attributeText);
                    pending = { displayName, duration, attrs, rawExtinf: originalLine };
                    pendingRawTags = [];
                    continue;
                }
                if (line.startsWith("#")) {
                    if (pending) pendingRawTags.push(originalLine);
                    continue;
                }
                if (pending) {
                    const groupTitle = pending.attrs["group-title"] || pending.attrs.group_title || pending.attrs.category || "Outros";
                    const name = pending.attrs["tvg-name"] || pending.displayName || "Sem título";
                    const type = classifyM3UItem(name, groupTitle, pending.attrs);
                    const item = {
                        name,
                        title: name,
                        url: line,
                        stream_url: line,
                        type,
                        group_title: groupTitle,
                        logo: pending.attrs["tvg-logo"] || pending.attrs.logo || "",
                        tvg_id: pending.attrs["tvg-id"] || "",
                        language: pending.attrs.language || "",
                        country: pending.attrs.country || "",
                        duration: pending.duration,
                        attributes: pending.attrs,
                        raw_extinf: pending.rawExtinf,
                        raw_tags: pendingRawTags,
                        source_url: sourceUrl
                    };
                    const seasonEpisode = name.match(/s(\d{1,3})e(\d{1,4})/i);
                    if (seasonEpisode) {
                        item.season = seasonEpisode[1];
                        item.episode = seasonEpisode[2];
                    }
                    items.push(item);
                    pending = null;
                    pendingRawTags = [];
                }
            }

            const liveItems = items.filter(item => item.type === "live");
            const movieItems = items.filter(item => item.type === "movie");
            const seriesItems = items.filter(item => item.type === "series");
            const seriesMap = {};
            for (const item of seriesItems) {
                const seriesTitle = item.attributes["series-title"] || item.attributes.series_title || item.name.replace(/\s+s\d+e\d+.*/i, "").trim();
                const seriesKey = `${item.group_title}::${seriesTitle}`;
                if (!seriesMap[seriesKey]) {
                    seriesMap[seriesKey] = {
                        series_title: seriesTitle || item.name,
                        name: seriesTitle || item.name,
                        title: seriesTitle || item.name,
                        logo: item.logo,
                        group_title: item.group_title,
                        type: "series",
                        description: `Série: ${seriesTitle || item.name}`,
                        seasons: [],
                        episodes: [],
                    };
                }
                const episode = {
                    title: item.name,
                    name: item.name,
                    url: item.url,
                    stream_url: item.stream_url,
                    logo: item.logo,
                    season: Number(item.season || item.attributes.season || 1),
                    episode: Number(item.episode || item.attributes.episode || 0),
                    type: "episode",
                };
                seriesMap[seriesKey].episodes.push(episode);
            }
            const series = Object.values(seriesMap);
            for (const serie of series) {
                const seasons = {};
                for (const episode of serie.episodes) {
                    if (!seasons[episode.season]) seasons[episode.season] = [];
                    seasons[episode.season].push(episode);
                }
                serie.seasons = Object.keys(seasons).sort((a, b) => Number(a) - Number(b)).map(seasonNum => ({
                    seasonNum: Number(seasonNum),
                    episodes: seasons[seasonNum].sort((a, b) => a.episode - b.episode)
                }));
            }

            const feed = {
                version: 1,
                source: { type: listType, url: sourceUrl, format: "m3u" },
                generated_at: new Date().toISOString(),
                total: items.length,
                total_live: liveItems.length,
                total_movies: movieItems.length,
                total_series: seriesItems.length,
                live: liveItems,
                movies: movieItems,
                series
            };
            return feed;
        }

        function buildCategoryJsonContents(m3uText, sourceUrl, listType) {
            const feed = parseM3UToCompleteJson(m3uText, sourceUrl, listType);
            if (!feed.total) throw new Error("Nenhum conteúdo válido foi encontrado na lista IPTV.");
            return {
                feed,
                tv: JSON.stringify({ feed: { ...feed, live: feed.live, movies: [], series: [] } }),
                filmes: JSON.stringify({ feed: { ...feed, live: [], movies: feed.movies, series: [] } }),
                series: JSON.stringify({ feed: { ...feed, live: [], movies: [], series: feed.series } })
            };
        }

        async function processAndSave() {
            const mac = document.getElementById("mac").value.trim().toUpperCase();
            const pin = document.getElementById("pin").value.trim();
            const playlistName = document.getElementById("playlist_name").value.trim();
            const slot = document.getElementById("slot").value;
            const statusDiv = document.getElementById("status");
            const btn = document.getElementById("btnSave");
            const btnText = document.getElementById("btnText");
            const btnLoader = document.getElementById("btnLoader");
            const progressContainer = document.getElementById("progressContainer");

            if (!mac || !pin || !playlistName) {
                showStatus("Preencha CODE, PIN e nome da playlist.", "error");
                return;
            }

            let sourceUrl;
            const codeDir = cleanCode(mac);
            if (!codeDir) {
                showStatus("O CODE precisa conter letras ou números.", "error");
                return;
            }

            if (currentListType === "m3u") {
                sourceUrl = document.getElementById("m3uUrl").value.trim();
                if (!sourceUrl) {
                    showStatus("Informe a URL da lista M3U.", "error");
                    return;
                }
                // Os três arquivos serão criados abaixo no mesmo diretório do CODE.
                sourceUrl = sourceUrl;

            } else {
                const server = document.getElementById("xtreamServer").value.trim();
                const user = document.getElementById("xtreamUser").value.trim();
                const pass = document.getElementById("xtreamPass").value.trim();
                if (!server || !user || !pass) {
                    showStatus("Preencha servidor, usuário e senha Xtream.", "error");
                    return;
                }
                sourceUrl = buildXtreamM3uUrl(server, user, pass);
                // Os três arquivos serão criados abaixo no diretório Xtream do CODE.
                sourceUrl = sourceUrl;

            }

            statusDiv.classList.add("hidden");
            btn.disabled = true;
            btnText.innerText = "PROCESSANDO...";
            btnLoader.classList.remove("hidden");
            progressContainer.classList.remove("hidden");

            try {
                updateProgress(10, "Buscando Token do GitHub...");
                const tokenResponse = await fetch(`${SB_URL}/Token?select=Token`, {
                    headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
                });
                if (!tokenResponse.ok) throw new Error(`Erro ao buscar Token: ${tokenResponse.status}`);
                const tokenData = await tokenResponse.json();
                if (!tokenData || tokenData.length === 0 || !tokenData[0].Token) throw new Error("Token do GitHub não encontrado.");
                const ghToken = tokenData[0].Token;

                updateProgress(30, "Baixando conteúdo da lista...");
                const finalContent = await downloadListContent(sourceUrl);
                if (!finalContent.includes("#EXTM3U") && currentListType === "m3u") {
                    throw new Error("O conteúdo baixado não parece ser uma lista M3U válida.");
                }

                updateProgress(60, "Convertendo todo o conteúdo para três JSONs...");
                const jsonFiles = buildCategoryJsonContents(finalContent, sourceUrl, currentListType);
                const basePath = currentListType === "m3u" ? `${GH_BASE_M3U}/${codeDir}` : `${GH_BASE_XTREME}/Code-/${codeDir}`;
                const filePaths = {
                    tv: `${basePath}/tv.json`,
                    filmes: `${basePath}/filmes.json`,
                    series: `${basePath}/series.json`
                };

                updateProgress(70, "Enviando tv.json, filmes.json e series.json para o GitHub...");
                for (const [key, path] of Object.entries(filePaths)) {
                    await uploadFileToGithub(
                        path,
                        encodeBase64Utf8(jsonFiles[key]),
                        ghToken,
                        `Importação ${key.toUpperCase()}: ${playlistName} (${codeDir})`
                    );
                }

                updateProgress(85, "Atualizando Supabase...");
                const rawBase = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_BRANCH}/${basePath}`;
                const query = `code=eq.${encodeURIComponent(mac)}&pin=eq.${encodeURIComponent(pin)}`;
                const checkRow = await fetch(`${SB_URL}/${SB_TABLE}?${query}`, {
                    headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}` }
                });
                if (!checkRow.ok) throw new Error(`Erro ao consultar Supabase: ${checkRow.status}`);
                const existingData = await checkRow.json();
                const payload = {
                    List0: `${rawBase}/tv.json`,
                    List1: `${rawBase}/filmes.json`,
                    List2: `${rawBase}/series.json`,
                    user: playlistName
                };
                let finalResponse;

                if (existingData && existingData.length > 0) {
                    finalResponse = await fetch(`${SB_URL}/${SB_TABLE}?${query}`, {
                        method: "PATCH",
                        headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
                        body: JSON.stringify(payload)
                    });
                } else {
                    finalResponse = await fetch(`${SB_URL}/${SB_TABLE}`, {
                        method: "POST",
                        headers: { "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Content-Type": "application/json", "Prefer": "return=minimal" },
                        body: JSON.stringify({ code: mac, pin: pin, ...payload })
                    });
                }
                if (!finalResponse.ok) throw new Error(`Erro Supabase: ${finalResponse.status}`);

                updateProgress(100, "Sucesso!");
                showStatus(`Sucesso: tv.json, filmes.json e series.json foram salvos no diretório do CODE e registrados nos slots List0, List1 e List2.`, "success");
            } catch (error) {
                showStatus(`Erro: ${error.message}`, "error");
            } finally {
                btn.disabled = false;
                btnText.innerText = "SALVAR NO ROKU";
                btnLoader.classList.add("hidden");
            }
        }

        function updateProgress(percent, text) {
            document.getElementById("progressBar").style.width = percent + "%";
            document.getElementById("progressPercent").innerText = percent + "%";
            document.getElementById("progressText").innerText = text;
        }

        function showStatus(msg, type) {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = msg;
            statusDiv.classList.remove("hidden", "bg-red-900", "bg-green-900");
            statusDiv.classList.add(type === "error" ? "bg-red-900" : "bg-green-900");
        }
    </script>
</body>
</html>
